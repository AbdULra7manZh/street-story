<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Street Story AR</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="ArStyle.css">
</head>

<body>
   <a href="index.html" class="close-ar">Close Camera</a>

    <a id="mapBtn" class="map-btn" target="_blank">
    Open Location
    </a>

    <button id="langBtn" class="lang-btn">
    العربية
    </button>

    <button id="closeCardBtn" class="close-card-btn">
    Close Card
</button>

<div id="htmlInfoCard" class="html-info-card">
    <h2 id="htmlStreetName"></h2>
    <p id="htmlStreetInfo"></p>
    <img id="htmlStreetImage" class="html-street-img">
</div>

    <div class="zoom-controls">
    <button id="zoomInBtn">+</button>
    <button id="zoomOutBtn">-</button>
</div>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;" >

        <!-- KAR -->
        <a-marker type="pattern" url="markers/pattern-KAR.patt" smooth="true" smooth-count="5" 
        smooth-tolerance="0.05" smooth-threshold="2">
            <a-entity id="infoCardKAR" class="info-card" position="0 0 0" rotation="-90 0 0">

                <a-plane id="cardBackgroundKAR" position="0 0 -0.01"
                    width="5" height="2.8" color="#8B6B00"
                    material="opacity: 0.88; depthWrite: false">
                </a-plane>

                <a-plane position="1.6 0.4 0.01"
                    width="1.5" height="2.0" color="#ffffff">
                </a-plane>

                <a-image id="streetImageKAR" position="1.6 0.4 0.02"
                    width="1.35" height="1.85">
                </a-image>

                <a-text id="streetNameKAR" value="" position="-2.2 1.0 0.05"
                    color="#fbbf24"
                    width="2.8"
                    anchor="left"
                    baseline="top"
                    wrap-count="22">
                    </a-text>

                <a-text id="streetInfoKAR" value="" position="-2.3 0.5 0.05"
                    color="#ffffff" width="2.0"
                    anchor="left" baseline="top" wrap-count="30">
                </a-text>

            </a-entity>

            <a-entity id="arabicCardKAR" class="info-card" position="0 0 0" rotation="-90 0 0" visible="false">

        <a-plane position="0 0 -0.01"
            width="5" height="2.8" color="#8B6B00"
            material="opacity: 0.88; depthWrite: false">
        </a-plane>

        <a-plane position="1.6 0.4 0.01"
            width="1.5" height="2.0" color="#ffffff">
        </a-plane>

        <a-image id="arabicStreetImageKAR"
            position="1.6 0.4 0.02"
            width="1.35" height="1.85">
        </a-image>

        <a-image id="arabicTextKAR"
            position="-1.15 0.15 0.06"
            width="2.4"
            height="2.25">
        </a-image>

    </a-entity>

        </a-marker>

        <!-- JCR -->
        <a-marker type="pattern" url="markers/pattern-JCR.patt" smooth="true" smooth-count="5" 
        smooth-tolerance="0.05" smooth-threshold="2">
           <a-entity id="infoCardJCR" class="info-card" position="0 0 0" rotation="-90 0 0">

                <a-plane id="cardBackgroundJCR" position="0 0 -0.01"
                    width="5" height="2.8" color="#0A4D68"
                    material="opacity: 0.92; depthWrite: false">
                </a-plane>

                <a-plane position="1.6 0.4 0.01"
                    width="1.5" height="2.0" color="#ffffff">
                </a-plane>

                <a-image id="streetImageJCR" position="1.6 0.4 0.02"
                    width="1.35" height="1.85">
                </a-image>

                <a-text id="streetNameJCR" value="" position="-2.3 1.0 0.05"
                    color="#fbbf24" width="1.8"
                    anchor="left" baseline="top" wrap-count="16">
                </a-text>

                <a-text id="streetInfoJCR" value="" position="-2.3 0.5 0.05"
                    color="#ffffff" width="2.0"
                    anchor="left" baseline="top" wrap-count="30">
                </a-text>

            </a-entity>

            <!-- كرت العربي JCR -->
<a-entity id="arabicCardJCR" class="info-card" position="0 0 0" rotation="-90 0 0" visible="false">

    <a-plane position="0 0 -0.01"
        width="5" height="2.8" color="#0A4D68"
        material="opacity: 0.92; depthWrite: false">
    </a-plane>

    <a-plane position="1.6 0.4 0.01"
        width="1.5" height="2.0" color="#ffffff">
    </a-plane>

    <a-image id="arabicStreetImageJCR"
        position="1.6 0.4 0.02"
        width="1.35" height="1.85">
    </a-image>

    <a-image id="arabicTextJCR"
        position="-1.15 0.15 0.06"
        width="2.4"
        height="2.25">
    </a-image>

</a-entity>
        </a-marker>

        <!-- PS -->
        <a-marker type="pattern" url="markers/pattern-PS.patt">
            <a-entity id="infoCardPS" class="info-card" position="0 0 0" rotation="-90 0 0">

                <a-plane id="cardBackgroundPS" position="0 0 -0.01"
                    width="5" height="2.8" color="#2E7D32"
                    material="opacity: 0.92; depthWrite: false">
                </a-plane>

                <a-plane position="1.6 0.4 0.01"
                    width="1.5" height="2.0" color="#ffffff">
                </a-plane>

                <a-image id="streetImagePS" position="1.6 0.4 0.02"
                    width="1.35" height="1.85">
                </a-image>

                <a-text id="streetNamePS" value="" position="-2.3 1.0 0.05"
                    color="#fbbf24" width="2.4"
                    anchor="left" baseline="top" wrap-count="16">
                </a-text>

                <a-text id="streetInfoPS" value="" position="-2.3 0.5 0.05"
                    color="#ffffff" width="2.0"
                    anchor="left" baseline="top" wrap-count="30">
                </a-text>

            </a-entity>

            <!-- كرت العربي PS -->
<a-entity id="arabicCardPS" class="info-card" position="0 0 0" rotation="-90 0 0" visible="false">

    <a-plane position="0 0 -0.01"
        width="5" height="2.8" color="#2E7D32"
        material="opacity: 0.92; depthWrite: false">
    </a-plane>

    <a-plane position="1.6 0.4 0.01"
        width="1.5" height="2.0" color="#ffffff">
    </a-plane>

    <a-image id="arabicStreetImagePS"
        position="1.6 0.4 0.02"
        width="1.35" height="1.85">
    </a-image>

    <a-image id="arabicTextPS"
        position="-1.15 0.15 0.06"
        width="2.4"
        height="2.25">
    </a-image>

</a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
    <script src="ar.js"></script>


</body>

</html>

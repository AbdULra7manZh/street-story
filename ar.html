<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Street Story AR</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .close-ar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            background: #fbbf24;
            color: #0f172a;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <a href="index.html" class="close-ar">Close Camera</a>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">
        <!-- KAR -->
        <a-marker type="pattern" url="markers/pattern-KAR.patt">

            <!-- CARD CONTAINER -->
            <a-entity id="cardKAR" position="0 0.5 0" rotation="-90 0 0">

                <!-- BACKGROUND -->
                <a-plane id="cardBackgroundKAR" position="0 0 -0.02" width="5" height="2.8" color="#8B6B00"
                    material="opacity: 0.88">
                </a-plane>

                <!-- IMAGE FRAME -->
                <a-plane position="1.4 0 0" width="1.6" height="2" color="#ffffff">
                </a-plane>

                <!-- STREET IMAGE -->
                <a-image id="streetImageKAR" position="1.4 0 0.02" width="1.45" height="1.8">
                </a-image>

                <!-- STREET NAME -->
                <a-text id="streetNameKAR" value="TEST TITLE" position="-1.8 0.9 0.15" color="#ffffff" width="3.2"
                    anchor="left" material="depthTest: false">
                </a-text>

                <!-- STREET INFO -->
                <a-text id="streetInfoKAR" value="TEST INFO" position="-1.8 0.3 0.15" color="#ffffff" width="2.6"
                    anchor="left" material="depthTest: false">
                </a-text>

            </a-entity>

        </a-marker>
        <!--        JCR      -->
        <a-marker type="pattern" url="markers/pattern-JCR.patt">

            <a-plane id="cardBackgroundJCR" position="0 0.5 0" rotation="-90 0 0" width="5" height="2.8" color="#0f172a"
                material="opacity: 0.92">
            </a-plane>

            <a-plane position="1.25 0.5 0.08" rotation="-90 0 0" width="1.8" height="2.1" color="#ffffff">
            </a-plane>

            <a-image id="streetImageJCR" position="1.25 0.5 0.25" rotation="-90 0 0" width="1.65" height="1.95">
            </a-image>

            <a-text id="streetNameJCR" position="-2.2 1.35 0.25" rotation="-90 0 0" color="#fbbf24" width="4">
            </a-text>

            <a-text id="streetInfoJCR" position="-2.2 0.9 0.25" rotation="-90 0 0" color="#ffffff" width="3.2">
            </a-text>

        </a-marker>

        <!--        PS      -->
        <a-marker type="pattern" url="markers/pattern-PS.patt">

            <a-plane id="cardBackgroundPS" position="0 0.5 0" rotation="-90 0 0" width="5" height="2.8" color="#0f172a"
                material="opacity: 0.92">
            </a-plane>

            <a-plane position="1.25 0.5 0.08" rotation="-90 0 0" width="1.8" height="2.1" color="#ffffff">
            </a-plane>

            <a-image id="streetImagePS" position="1.25 0.5 0.25" rotation="-90 0 0" width="1.65" height="1.95">
            </a-image>

            <a-text id="streetNamePS" position="-2.2 1.35 0.25" rotation="-90 0 0" color="#fbbf24" width="4">
            </a-text>

            <a-text id="streetInfoPS" position="-2.2 0.9 0.25" rotation="-90 0 0" color="#ffffff" width="3.2">
            </a-text>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
    <script src="info.js"></script>
    <script src="ar.js"></script>

</body>

</html>
